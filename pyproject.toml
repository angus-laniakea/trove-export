[project]
name = "trove-export"
version = "0.1.0"
description = "Export Trove greeks to CSV (desk format) and optionally upload to S3"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "grpcio>=1.60",
    "protobuf>=4.25",
    "trove",
]

[project.scripts]
export-trove-greeks = "trove_export.export_greeks_csv:main"

[tool.uv.sources]
trove = { path = "../sp-vol/trove/proto/gen/python/trove" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trove_export"]
